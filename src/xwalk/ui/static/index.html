<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="xwalk-token" content="__XWALK_TOKEN__">
  <title>xwalk explorer</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <img src="/static/favicon.svg" alt="" width="28" height="28">
        <span>xwalk <small id="version"></small></span>
      </a>
      <nav>
        <a href="#/" data-nav="home">Workspace</a>
        <a href="#/guide" data-nav="guide">How xwalk works</a>
        <a href="#/tasks" data-nav="tasks">Tasks <span class="pill" id="task-count" hidden></span></a>
      </nav>
      <div class="side-section">
        <h4>Jobs</h4>
        <div id="side-jobs" class="side-list"></div>
      </div>
      <div class="side-section">
        <h4>Runs</h4>
        <div id="side-runs" class="side-list"></div>
      </div>
      <footer class="side-foot" id="root-path"></footer>
    </aside>
    <main id="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header>
        <h3 id="drawer-title"></h3>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </section>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
