name: ncbi_disease_nomatch_jev_bm25
templates:
  query: '{{ mention }}'
  context: '{{ context_left }}[{{ mention }}]{{ context_right }}'
  doc: '{{ label }} {{ synonyms | join('' '') }} {{ definition }}'
  candidate: 'ID: {{ id }}

    Label: {{ label }}

    {% if synonyms %}Synonyms: {{ synonyms | join(''; '') }}{% endif %}

    {% if definition %}Definition: {{ definition }}{% endif %}

    '
target:
  kind: jsonl
  path: targets.jsonl
  id_field: id
source:
  kind: jsonl
  path: mentions.jsonl
  id_field: id
retrievers:
- kind: bm25
  name: bm25
  limit: 200
  exact_fields:
  - label
  - synonyms
prompts:
  slots: examples/ncbi_disease/slots_jev.yaml
policy:
  accept_at: 0.75
  property_floor: 0.5
  choose_at: 0.5
  screen_floor: 0.3
  chunk_size: 50
  max_candidates: 300
  concurrency: 16
decider:
  kind: jev
  model: ~typesafe/jev-latest
  base_url: https://openrouter.ai/api/alpha/decisions
  api_key_env: OPENROUTER_API_KEY
