[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xwalk"
version = "0.1.1"
description = "LLM-RAG record matching between two collections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Androle", email = "jandrole2@gmail.com" }]
keywords = [
    "record-linkage",
    "entity-matching",
    "entity-linking",
    "ontology",
    "crosswalk",
    "rag",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tantivy>=0.22",
]

# Must come after every bare `key = value` in [project]: a table header ends the
# preceding table, so anything below it would be parsed as a URL entry.
[project.urls]
Homepage = "https://github.com/jan3657/xwalk"
Documentation = "https://github.com/jan3657/xwalk#readme"
Repository = "https://github.com/jan3657/xwalk"
Issues = "https://github.com/jan3657/xwalk/issues"
Changelog = "https://github.com/jan3657/xwalk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.0", "faiss-cpu>=1.8"]
ontology = ["rdflib>=7.0"]
sql = ["sqlalchemy>=2.0"]
litellm = ["litellm>=1.40"]
all = ["xwalk[dense,ontology,sql,litellm]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
xwalk = "xwalk.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xwalk"]

[tool.hatch.build.targets.sdist]
# `_env.sh` hardcodes this developer's Ceph paths -- useless to anyone else and a
# needless disclosure of a directory layout. `data/` and `runs/` are run output.
exclude = ["_env.sh", "data/", "runs/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits a real LLM provider; skipped without an API key",
    "dense: needs xwalk[dense]",
    "ontology: needs xwalk[ontology]",
    "sql: needs xwalk[sql]",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff formats fenced Python inside Markdown. Prose is not source: the snippets here are
# written for a reader, with aligned trailing comments and deliberately compact calls that
# the formatter would explode. Excluding `.md` also keeps a bare `ruff format` at the repo
# root agreeing with the narrower paths CI lints.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/xwalk", "scripts", "examples"]

# Optional extras are, by definition, absent from the base dev environment. Typing the
# call sites is what matters; chasing stubs for a package the base install must not pull
# would make the gate depend on which extras happen to be installed.
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "numpy.*",
    "sentence_transformers.*",
    "rdflib.*",
    "sqlalchemy.*",
    "litellm.*",
]
ignore_missing_imports = true
