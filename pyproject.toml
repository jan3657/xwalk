[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xwalk"
version = "0.1.0.dev0"
description = "LLM-RAG record matching between two collections"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tantivy>=0.22",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.0", "faiss-cpu>=1.8"]
ontology = ["rdflib>=7.0"]
sql = ["sqlalchemy>=2.0"]
litellm = ["litellm>=1.40"]
all = ["xwalk[dense,ontology,sql,litellm]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
xwalk = "xwalk.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xwalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits a real LLM provider; skipped without an API key",
    "dense: needs xwalk[dense]",
    "ontology: needs xwalk[ontology]",
    "sql: needs xwalk[sql]",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/xwalk", "scripts", "examples"]
