# NCBI Disease with hybrid retrieval: the job's BM25 plus the default API dense encoder
# (Qwen3-Embedding 8B through OpenRouter) with per-name vectors. Needs OPENROUTER_API_KEY
# for the embeddings and OPENAI_API_KEY for the LLM. Otherwise identical to job.yaml.
name: ncbi_disease_dense
templates:
  query: "{{ mention }}"
  context: "{{ context_left }}[{{ mention }}]{{ context_right }}"
  doc: "{{ label }} {{ synonyms | join(' ') }} {{ definition }}"
  candidate: |
    ID: {{ id }}
    Label: {{ label }}
    {% if synonyms %}Synonyms: {{ synonyms | join('; ') }}{% endif %}
    {% if definition %}Definition: {{ definition }}{% endif %}

target:
  kind: tsv
  path: sample/targets.tsv
  id_column: id
  multivalue_columns: [synonyms]

source:
  kind: jsonl
  path: sample/mentions.jsonl
  id_field: mention_id

retrievers:
  - kind: bm25
    name: bm25
    limit: 30
    exact_fields: [label, synonyms]
  - kind: dense
    name: qwen3
    limit: 30
    encoder: openai_embeddings
    name_fields: [label, synonyms]

llm:
  kind: openai_compat
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  profile: openai

prompts:
  slots: slots.yaml

policy:
  max_attempts: 3
  accept_at: 0.6
  review_floor: 0.4
  verify_band: [0.6, 0.8]
  concurrency: 8

selector:
  max_candidates: 25
