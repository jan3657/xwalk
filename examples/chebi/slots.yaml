entity_noun: chemical entity mention
target_noun: ChEBI ontology term
domain_brief: biomedical chemistry nomenclature
rubric:
  - score: 1.0
    name: Certain
    when: exact case-insensitive match to the candidate label or one of its synonyms
    example: garlic -> Garlic
  - score: 0.9
    name: High
    when: a normalized form, plural, or common abbreviation of the candidate
    example: ASA -> acetylsalicylic acid
  - score: 0.6
    name: Plausible
    when: the source names a specific instance of the candidate class
    example: Fuji apple -> apple
  - score: 0.4
    name: Speculative
    when: related only by broad category
    example: sugar -> carbohydrate
hard_rules:
  - For regulated substances, any difference in name or number means distinct entities
  - A salt, ester, or hydrate is a distinct entity from its parent compound
  - >-
    An anomer (alpha-D-glucose, beta-D-glucose) is a distinct term from the unqualified
    parent (glucose). Choose the anomer only when the mention itself specifies it.
  - >-
    A conjugate base and its acid are distinct terms. Prefer the acid for an acid
    mention and the base for a base mention; never treat them as interchangeable.
  - >-
    If no candidate names the same chemical species, abstain. A plausible-looking
    neighbour is worse than no match, because a wrong mapping is silently wrong.
disambiguation_steps: >-
  Read the surrounding context before choosing. "Sugar" in a clinical blood-glucose
  sentence is glucose; in a cooking sentence it is sucrose. When the mention carries a
  stereochemical or ionic qualifier, that qualifier is decisive and must be honoured.
# Used only by the decider path (see docs/reference/decide.md); the LLM skeletons
# ignore this block. Each property restates a hard rule as a yes/no question the
# gate can score independently of the rubric.
properties:
  - name: salt_ester_or_hydrate
    question: >-
      Do the source and the candidate agree on whether the entity is the parent compound
      or a salt, ester, or hydrate of it, wherever either states one?
  - name: stereochemistry
    question: >-
      Do the source and the candidate agree on stereochemistry and anomeric form
      (alpha/beta, D/L, R/S, cis/trans) wherever either states one?
  - name: acid_or_conjugate_base
    question: >-
      Do the source and the candidate agree on whether the entity is the acid or its
      conjugate base or ion, wherever either states one?
