name: chebi_jev
templates:
  context: '{{ context_left }}[{{ mention }}]{{ context_right }}'
  doc: '{{ label }} {{ synonyms | join('' '') }} {{ definition }}'
  candidate: 'ID: {{ id }}

    Label: {{ label }}

    {% if synonyms %}Synonyms: {{ synonyms | join(''; '') }}{% endif %}

    {% if definition %}Definition: {{ definition }}{% endif %}

    '
  queries:
  - '{{ mention }}'
target:
  kind: owl
  path: sample/targets.owl
source:
  kind: jsonl
  path: sample/mentions.jsonl
  id_field: mention_id
retrievers:
- kind: bm25
  name: bm25
  limit: 200
  exact_fields:
  - label
  - synonyms
- kind: dense
  name: e5
  model: intfloat/multilingual-e5-small
  limit: 150
  query_prefix: 'query: '
  doc_prefix: 'passage: '
prompts:
  slots: slots.yaml
policy:
  accept_at: 0.85
  screen_floor: 0.3
  chunk_size: 50
  max_candidates: 300
  concurrency: 16
decider:
  kind: jev
  model: ~typesafe/jev-latest
  base_url: https://openrouter.ai/api/alpha/decisions
  api_key_env: XWALK_TEST_API_KEY
