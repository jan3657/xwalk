# Paths resolve against this file's directory.
name: chebi
templates:
  query: "{{ mention }}"
  context: "{{ context_left }}[{{ mention }}]{{ context_right }}"
  doc: "{{ label }} {{ synonyms | join(' ') }} {{ definition }}"
  candidate: |
    ID: {{ id }}
    Label: {{ label }}
    {% if synonyms %}Synonyms: {{ synonyms | join('; ') }}{% endif %}
    {% if definition %}Definition: {{ definition }}{% endif %}

target:
  kind: owl
  path: sample/targets.owl

source:
  kind: jsonl
  path: sample/mentions.jsonl
  id_field: mention_id

retrievers:
  - kind: bm25
    name: bm25
    limit: 25
    exact_fields: [label, synonyms]

llm:
  kind: openai_compat
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  profile: openai

prompts:
  slots: slots.yaml

policy:
  max_attempts: 3
  accept_at: 0.6
  review_floor: 0.4
  verify_band: [0.6, 0.8]
  concurrency: 8

selector:
  max_candidates: 25
